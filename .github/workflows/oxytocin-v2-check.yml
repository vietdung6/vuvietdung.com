name: Validate OXYTOCIN v2
on:
  pull_request:
    paths:
      - 'oxytocin/v2/**'
      - 'tests/oxytocin-v2.php'
      - 'tests/oxytocin-v2-editor.php'
      - 'tests/oxytocin-v2-settings.php'
      - 'tests/oxytocin-v2-preview.php'
      - 'tests/oxytocin-v2-reader.php'
      - 'tests/oxytocin-v2-reader-fixture.php'
      - 'tests/oxytocin-v2-reader-http.sh'
      - 'tests/oxytocin-v2-browser.mjs'
      - 'tests/oxytocin-v2-autoinit.php'
      - 'tests/oxytocin-v2-legacy-login.php'
      - '.gitignore'
      - 'tests/oxytocin-v2-backup.sh'
      - 'tests/oxytocin-v2-archive.sh'
      - '.github/workflows/deploy-production.yml'
      - 'oxytocin/.htaccess'
      - '.github/workflows/oxytocin-v2-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, dom
          coverage: none
      - name: PHP syntax
        run: |
          php -l oxytocin/v2/lib.php
          php -l oxytocin/v2/init.php
          php -l oxytocin/v2/backup-legacy.php
          php -l oxytocin/v2/admin.php
          php -l oxytocin/v2/render.php
          php -l oxytocin/v2/preview.php
          php -l oxytocin/v2/public.php
          php -l oxytocin/v2/index.php
          php -l oxytocin/v2/part.php
          php -l oxytocin/v2/arc.php
          php -l oxytocin/v2/episode.php
          php -l oxytocin/v2/chapter.php
          php -l oxytocin/v2/episode-read.php
          php -l tests/oxytocin-v2-reader.php
          php -l tests/oxytocin-v2-reader-fixture.php
          php -l tests/oxytocin-v2-editor.php
          php -l tests/oxytocin-v2-settings.php
          php -l tests/oxytocin-v2-preview.php
          php -l tests/oxytocin-v2.php
          php -l tests/oxytocin-v2-autoinit.php
          php -l tests/oxytocin-v2-legacy-login.php
      - name: SQLite CRUD and isolation tests
        run: php tests/oxytocin-v2.php
      - name: Automatic blank SQLite initialization and no-overwrite tests
        run: php tests/oxytocin-v2-autoinit.php
      - name: Rich editor and publication tests
        run: php tests/oxytocin-v2-editor.php
      - name: Site settings, synopsis and legacy separation
        run: php tests/oxytocin-v2-settings.php
      - name: Preview cannot publish
        run: php tests/oxytocin-v2-preview.php
      - name: Reader access and navigation tests
        run: php tests/oxytocin-v2-reader.php
      - name: Public HTTP smoke tests
        run: bash tests/oxytocin-v2-reader-http.sh
      - name: Legacy SQLite backup safety
        run: bash tests/oxytocin-v2-backup.sh
      - name: Check cPanel archive privacy and legacy paths
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          rsync -a ./ "$stage" \
            --exclude '.git/' --exclude '.github/' --exclude '.deploy/' --exclude '.preview/' \
            --exclude 'node_modules/' --exclude 'tests/' --exclude 'scripts/' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'README.md' \
            --exclude '.gitignore' --exclude 'oxytocin/oxytocin.db' \
            --exclude 'oxytocin/*.db' --exclude 'oxytocin/*.db-*' --exclude 'oxytocin/*.sqlite*' \
            --exclude 'oxytocin/v2/*.db' --exclude 'oxytocin/v2/*.db-*' \
            --exclude 'oxytocin/v2/*.sqlite*' --exclude 'oxytocin/v2/.data/*.db*' \
            --exclude 'oxytocin/v2/.data/*.sqlite*' --exclude 'oxytocin/v2/.data/.env*' \
            --exclude 'oxytocin/.env*' \
            --exclude 'oxytocin/v2/.env*' --exclude 'oxytocin/error_log' \
            --exclude 'oxytocin/test_write.db'
          bash tests/oxytocin-v2-archive.sh "$stage"
      - name: JavaScript syntax
        run: |
          node --check oxytocin/v2/editor.js
          node --check oxytocin/v2/reader.js
          node --check tests/oxytocin-v2-browser.mjs
      - name: Set up Chromium browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Real desktop/mobile browser integration
        run: node tests/oxytocin-v2-browser.mjs
